{% extends "base.html" %}{% block title %}Add Vehicle · AutoShield{% endblock %}{% block crumb %}Add vehicle{% endblock %}{% block content %}<div class="heading"><small class="eyebrow">VEHICLE REGISTRY</small><h1>Add a vehicle<span>.</span></h1><p>Enter the vehicle details to create a local record.</p></div><section class="panel"><form method="post" class="form form-grid"><div class="form-grid"><label>Registration number *<input name="plate" required placeholder="MH01AB1234"></label><label>Make *<input name="make" required placeholder="Tata"></label><label>Model *<input name="model" required placeholder="Nexon"></label><label>Manufacturing year *<input name="year" type="number" min="1950" max="{{2026}}" required></label><label>Colour<input name="color"></label><label>Fuel type<select name="fuel"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option><option>Hybrid</option></select></label><label>Engine capacity (cc)<input name="engine_cc" type="number" min="0"></label><label>Current odometer (km)<input name="odometer_km" type="number" min="0" value="0"></label><label>Annual usage (km)<input name="annual_km" type="number" min="1" value="12000"></label><label>Services in last 5 years<input name="services_last_5y" type="number" min="0" value="0"></label><label>Reported engine fault codes<input name="engine_fault_codes" type="number" min="0" value="0"></label><label>Harsh-driving events<input name="harsh_driving_events" type="number" min="0" value="0"></label><label>Owner / label<input name="owner" placeholder="Optional"></label><label>Notes<textarea name="notes" rows="2"></textarea></label></div><button class="btn primary" type="submit">Save vehicle</button></form></section>{% endblock %}
